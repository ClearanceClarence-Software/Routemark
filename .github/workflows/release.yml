# Push a tag like v0.1.4 and this builds the plugin zip and attaches it to a
# GitHub release. The tag has to match the version in the plugin files.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag is $GITHUB_REF_NAME but package.json says $version"; exit 1
          fi
      - run: npm run zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Restbench ${GITHUB_REF_NAME#v}" --generate-notes
